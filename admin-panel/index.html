<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo/mayur-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mayur Fashion - Admin Management Portal</title>
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:#0d0d0d;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;color:#ffffff;font-family:sans-serif;">
        <img src="/assets/logo/mayur-official-brand-logo-white.png" alt="Mayur Fashion Logo" style="max-height:60px;max-width:220px;margin-bottom:18px;" />
        <div style="width:140px;height:3px;background:rgba(255,255,255,0.15);border-radius:99px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;height:100%;width:50%;background:#EF233C;animation:adminLoad 1s infinite alternate ease-in-out;"></div>
        </div>
        <style>
          @keyframes adminLoad {
            from { transform: translateX(-50%); }
            to { transform: translateX(150%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
